<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc"><title id="title">Mumbai Street architecture: a 3D world and readable documents</title><desc id="desc">At build time, Blender sources and artwork become GLB models and textures. MDX and photos pass through Astro and Sharp to become static HTML, JSON and image variants. In the browser, URL and history coordinate Three.js scene controllers with native HTML readers and a same-origin projects iframe. Original or optional Pixel rendering affects the street; HTML remains crisp.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#087d80" stroke-width="1.4"/></marker></defs><rect width="720" height="1120" fill="#f5f3ed"/><text x="48" y="54" fill="#087d80" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="48" dy="0">MUMBAI STREET</tspan></text><text x="48" y="111" fill="#142d3d" font-family="Georgia, serif" font-size="46" font-weight="400" text-anchor="start"><tspan x="48" dy="0">A street you can read.</tspan></text><path d="M48 148H672" stroke="#cad2ce" stroke-width="2"/><text x="48" y="197" fill="#087d80" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="48" dy="0">BUILD TIME</tspan></text><text x="48" y="263" fill="#142d3d" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="48" dy="0">Blender sources</tspan><tspan x="48" dy="41">+ artwork</tspan></text><text x="386" y="263" fill="#142d3d" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="386" dy="0">MDX + photos</tspan></text><path d="M65 328L65 360" stroke="#087d80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M403 282L403 312" stroke="#087d80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="386" y="355" fill="#5b686c" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="386" dy="0">Astro + Sharp</tspan></text><path d="M403 374L403 405" stroke="#087d80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="48" y="407" fill="#142d3d" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="48" dy="0">GLB models</tspan><tspan x="48" dy="43">+ textures</tspan></text><text x="386" y="450" fill="#142d3d" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="386" dy="0">HTML + JSON</tspan><tspan x="386" dy="43">Image variants</tspan></text><path d="M48 532H672" stroke="#cad2ce" stroke-width="2"/><text x="48" y="585" fill="#087d80" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="48" dy="0">RUNTIME / BROWSER</tspan></text><text x="48" y="653" fill="#142d3d" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start"><tspan x="48" dy="0">Three.js</tspan></text><text x="386" y="653" fill="#142d3d" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start"><tspan x="386" dy="0">Native HTML</tspan></text><text x="48" y="699" fill="#142d3d" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="48" dy="0">Scene +</tspan><tspan x="48" dy="42">controllers</tspan></text><text x="386" y="699" fill="#142d3d" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="386" dy="0">Readers +</tspan><tspan x="386" dy="42">same-origin</tspan><tspan x="386" dy="42">project iframe</tspan></text><path d="M177 765V818H529V805" stroke="#087d80" stroke-width="3" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="360" y="864" fill="#087d80" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle"><tspan x="360" dy="0">URL + browser history</tspan></text><text x="360" y="907" fill="#5b686c" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle"><tspan x="360" dy="0">Entry, transitions + return views</tspan></text><path d="M48 940H672" stroke="#cad2ce" stroke-width="2"/><text x="48" y="986" fill="#5b686c" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="48" dy="0">Rendering</tspan></text><text x="386" y="986" fill="#5b686c" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="386" dy="0">HTML interface</tspan></text><text x="48" y="1030" fill="#142d3d" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="48" dy="0">Original or</tspan><tspan x="48" dy="43">optional Pixel</tspan></text><text x="386" y="1030" fill="#142d3d" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="386" dy="0">Crisp text +</tspan><tspan x="386" dy="43">native controls</tspan></text></svg>
