<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Mumbai Street architecture: a 3D world and readable documents</title><desc id="desc">At build time, Blender sources and artwork become GLB models and textures. MDX and photos pass through Astro and Sharp to become static HTML, JSON and image variants. In the browser, URL and history coordinate Three.js scene controllers with native HTML readers and a same-origin projects iframe. Original or optional Pixel rendering affects the street; HTML remains crisp.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#087d80" stroke-width="1.4"/></marker></defs><rect width="1440" height="760" fill="#f5f3ed"/><text x="64" y="37" fill="#087d80" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="64" dy="0">MUMBAI STREET / IMPLEMENTATION MAP</tspan></text><text x="64" y="88" fill="#142d3d" font-family="Georgia, serif" font-size="40" font-weight="400" text-anchor="start"><tspan x="64" dy="0">A 3D street, readable documents.</tspan></text><path d="M64 120H1376" stroke="#cad2ce" stroke-width="2"/><text x="64" y="164" fill="#087d80" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="64" dy="0">BUILD TIME</tspan></text><text x="64" y="210" fill="#142d3d" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start"><tspan x="64" dy="0">Blender sources + artwork</tspan></text><text x="794" y="210" fill="#142d3d" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start"><tspan x="794" dy="0">MDX + photos</tspan></text><path d="M82 225L82 243" stroke="#087d80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M812 225L812 243" stroke="#087d80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="112" y="258" fill="#5b686c" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start"><tspan x="112" dy="0">Export + asset preparation</tspan></text><text x="842" y="258" fill="#5b686c" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start"><tspan x="842" dy="0">Astro + Sharp</tspan></text><path d="M82 270L82 288" stroke="#087d80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M812 270L812 288" stroke="#087d80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="64" y="320" fill="#142d3d" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start"><tspan x="64" dy="0">GLB models + textures</tspan></text><text x="794" y="320" fill="#142d3d" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start"><tspan x="794" dy="0">Static HTML, JSON + image variants</tspan></text><path d="M64 350H1376" stroke="#cad2ce" stroke-width="2"/><text x="64" y="391" fill="#087d80" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="64" dy="0">RUNTIME / BROWSER</tspan></text><text x="64" y="440" fill="#142d3d" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start"><tspan x="64" dy="0">Three.js scene + controllers</tspan></text><text x="794" y="440" fill="#142d3d" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start"><tspan x="794" dy="0">Native HTML readers</tspan></text><text x="64" y="480" fill="#5b686c" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Assets, camera + interaction state</tspan></text><text x="794" y="480" fill="#5b686c" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start"><tspan x="794" dy="0">Blog, contact + photo albums</tspan><tspan x="794" dy="34">Same-origin projects iframe</tspan></text><path d="M340 504V548H1094V535" stroke="#087d80" stroke-width="2.5" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="527" y="527" width="374" height="43" fill="#f5f3ed"/><text x="714" y="556" fill="#087d80" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle"><tspan x="714" dy="0">URL + browser history</tspan></text><text x="714" y="592" fill="#5b686c" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle"><tspan x="714" dy="0">Coordinate entry, transitions and return views</tspan></text><path d="M64 624H1376" stroke="#cad2ce" stroke-width="2"/><text x="64" y="665" fill="#5b686c" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Street rendering</tspan></text><text x="64" y="702" fill="#142d3d" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="64" dy="0">Original or optional Pixel</tspan></text><text x="794" y="665" fill="#5b686c" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="794" dy="0">Document interface</tspan></text><text x="794" y="702" fill="#142d3d" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="794" dy="0">Crisp text + native controls</tspan></text></svg>
